name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # The deploy mirror only feeds Vercel; checks run once, on the canonical repo.
    if: github.repository == 'ReelSet/reelset'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/render/container/skia/package-lock.json
      - run: npm ci
      - run: npm ci --prefix workers/render/container/skia
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --prefix workers/render/container/skia
      - name: Install ffmpeg (the Skia selftest encodes a short fixture)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: npm run selftest --prefix workers/render/container/skia
