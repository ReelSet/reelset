name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/render/container/skia/package-lock.json
      - run: npm ci
      - run: npm ci --prefix workers/render/container/skia
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --prefix workers/render/container/skia
      - run: npm run selftest --prefix workers/render/container/skia
