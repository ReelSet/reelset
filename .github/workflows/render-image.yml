name: Render image

on:
  push:
    branches: [main, render-box]
    paths:
      - workers/render/container/**
      - .github/workflows/render-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: render-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/reelset/reelset-render

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: workers/render/container
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Kokoro smoke test (native arm64)
        run: docker run --rm --platform linux/arm64 ${{ env.IMAGE }}:${{ github.sha }} python -m reel.kokoro_smoke
      - uses: docker/build-push-action@v6
        with:
          context: workers/render/container
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
