name: Render image

on:
  push:
    branches: [main, render-box]
    paths:
      - workers/render/container/**
      - .github/workflows/render-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: render-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/reelset/reelset-render

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: workers/render/container
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Kokoro smoke test (native ${{ matrix.arch }})
        run: docker run --rm --platform linux/${{ matrix.arch }} ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }} python -m reel.kokoro_smoke
      - name: Skia renderer self test (native ${{ matrix.arch }})
        run: docker run --rm --platform linux/${{ matrix.arch }} ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }} node /app/skia/dist/draw.mjs --selftest
      - name: Push arch image
        run: docker push ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-arch tags
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:latest -t ${{ env.IMAGE }}:${{ github.sha }} \
            ${{ env.IMAGE }}:${{ github.sha }}-amd64 ${{ env.IMAGE }}:${{ github.sha }}-arm64
